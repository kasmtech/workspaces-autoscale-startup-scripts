image: docker:29.4.3
services:
  - docker:29.4.3-dind

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_AUTH_CONFIG: ${_DOCKER_AUTH_CONFIG}

default:
  tags:
    - oci-fixed-amd

workflow:
  rules:
    - when: always

before_script:
  - SANITIZED_BRANCH=$(echo $CI_COMMIT_REF_NAME | sed -r 's#^release/##' | sed 's/\//_/g')

stages:
  - build
  - deploy

build:windows:
  stage: build
  image: python:3.12
  variables:
    VENV_PATH: "/opt/poetry"
  script:
    - apt-get update -y
    - python3 -m venv "$VENV_PATH"
    - source "$VENV_PATH"/bin/activate
    - pip install poetry
    - cd windows_vms/build/
    - poetry install
    - cd $OLDPWD
    - bash windows_vms/build/build.sh
  artifacts:
    paths:
      - windows_vms/dist/kasm-windows-startup.zip

build:linux:
  stage: build
  image: debian:stable-slim
  script:
    # Renders deb.sh / rpm.sh into linux_vms/dist/ (collapses {{ }}, blanks {tokens})
    # and fails the job if the result is not valid bash. No extra deps needed.
    - bash linux_vms/build/build.sh
  artifacts:
    paths:
      - linux_vms/dist/deb.sh
      - linux_vms/dist/rpm.sh

deploy:windows:
  stage: deploy
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  script:
    - S3_DOC_BUCKET=kasmweb-build-artifacts
    - |
      if [[ $CI_COMMIT_REF_NAME == "develop" || $CI_COMMIT_REF_NAME =~ ^release/.*$ ]]; then
        ZIP_PATH=kasm-autoscale-scripts/${SANITIZED_BRANCH}
      else
        ZIP_PATH=kasm-autoscale-scripts/${SANITIZED_BRANCH}/$CI_COMMIT_SHORT_SHA
      fi
    - S3_URL="https://${S3_DOC_BUCKET}.s3.amazonaws.com/${ZIP_PATH}/kasm-windows-startup.zip"
    - aws s3 cp windows_vms/dist/kasm-windows-startup.zip s3://${S3_DOC_BUCKET}/${ZIP_PATH}/kasm-windows-startup.zip
    - curl --request POST --header "PRIVATE-TOKEN:${GITLAB_API_TOKEN}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/statuses/${CI_COMMIT_SHA}?state=success&name=kasm-windows-startup.zip&target_url=${S3_URL}"

deploy:linux:
  stage: deploy
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  script:
    - S3_DOC_BUCKET=kasmweb-build-artifacts
    - |
      if [[ $CI_COMMIT_REF_NAME == "develop" || $CI_COMMIT_REF_NAME =~ ^release/.*$ ]]; then
        SCRIPT_PATH=kasm-autoscale-scripts/${SANITIZED_BRANCH}
      else
        SCRIPT_PATH=kasm-autoscale-scripts/${SANITIZED_BRANCH}/$CI_COMMIT_SHORT_SHA
      fi
    - |
      for f in deb.sh rpm.sh; do
        aws s3 cp "linux_vms/dist/${f}" "s3://${S3_DOC_BUCKET}/${SCRIPT_PATH}/${f}"
        S3_URL="https://${S3_DOC_BUCKET}.s3.amazonaws.com/${SCRIPT_PATH}/${f}"
        curl --request POST --header "PRIVATE-TOKEN:${GITLAB_API_TOKEN}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/statuses/${CI_COMMIT_SHA}?state=success&name=${f}&target_url=${S3_URL}"
      done
